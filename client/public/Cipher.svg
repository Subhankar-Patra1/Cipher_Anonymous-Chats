<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Main 3D Color Gradient -->
    <linearGradient id="bgGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#8d55f6" />
      <stop offset="35%" stop-color="#692bea" />
      <stop offset="75%" stop-color="#4d15d6" />
      <stop offset="100%" stop-color="#3b0cbe" />
    </linearGradient>

    <!-- Inner Bevel & Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Subtle Shadow for the Lightning Bolt -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2a0088" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Speech Bubble Shape -->
  <path 
    d="M 100 20 A 80 80 0 1 1 62 170.4 L 28 181 A 3 3 0 0 1 25 177 L 32 142.1 A 80 80 0 0 1 100 20 Z" 
    fill="url(#bgGrad)" 
    stroke="url(#bgGrad)" 
    stroke-width="3" 
    stroke-linejoin="round" 
  />

  <!-- 3D Bevel Overlay -->
  <path 
    d="M 100 20 A 80 80 0 1 1 62 170.4 L 28 181 A 3 3 0 0 1 25 177 L 32 142.1 A 80 80 0 0 1 100 20 Z" 
    fill="none" 
    stroke="url(#glowGrad)" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />

  <!-- Inner Lightning Bolt -->
  <path 
    d="M 113 37 L 63 107 H 98 L 78 162 L 138 82 H 103 Z" 
    fill="#ffffff" 
    filter="url(#boltShadow)" 
    stroke="#ffffff" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />
</svg>
